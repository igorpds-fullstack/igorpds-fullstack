<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="250" viewBox="0 0 1000 250" fill="none" role="img">
<defs>
<pattern id="gridPat" width="28" height="28" patternUnits="userSpaceOnUse">
  <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#17171F" stroke-width="1"/>
</pattern>
<radialGradient id="glow" cx="8%" cy="0%" r="70%">
  <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
  <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
</radialGradient>
<linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
  <stop offset="35%" stop-color="#A78BFA"/>
  <stop offset="65%" stop-color="#8B5CF6"/>
  <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
</linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#A78BFA"/>
  <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.15"/>
</linearGradient>
<clipPath id="clipAll"><rect width="1000" height="250" rx="16"/></clipPath></defs>
<style>
.rot{opacity:0;animation:rot 16s linear infinite}
@keyframes rot{0%{opacity:0}1.5%{opacity:1}22%{opacity:1}24%{opacity:0}100%{opacity:0}}
.sweep{animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-320px)}100%{transform:translateX(1000px)}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  .rot{animation:none;opacity:0}
  .rot-0{opacity:1}
  .sweep{animation:none;transform:translateX(340px)}
  .cursor{animation:none;opacity:1}
}</style>


<rect width="1000" height="250" rx="16" fill="#0B0B0F"/>
<rect width="1000" height="250" rx="16" fill="url(#gridPat)"/>
<rect width="1000" height="250" rx="16" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="999" height="249" rx="16" stroke="#24242F"/>
<g clip-path="url(#clipAll)">
  <rect x="0" y="0" width="4" height="250" fill="url(#bar)"/>
  <g class="sweep"><rect x="0" y="249" width="320" height="1" fill="url(#accentLine)"/></g>
</g>

<g opacity="0.85">
