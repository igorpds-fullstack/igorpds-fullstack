  <text x="100" y="58" font-family="ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#8B5CF6" text-anchor="start" opacity="1">$</text>
  <text x="116" y="58" font-family="ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#8A8A9E" text-anchor="start" opacity="1">whoami</text>
  <rect class="cursor" x="163" y="48" width="7" height="13" fill="#A78BFA"/>
</g>

<text x="48" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#E9E9F2" letter-spacing="-0.8">Igor Pereira dos Santos</text>
