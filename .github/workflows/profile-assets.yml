name: Perfil · gerar painéis

# Os SVGs do README são gerados aqui, direto da API do GitHub, por scripts
# deste repositório — sem depender de serviço externo que possa sair do ar.

on:
  schedule:
    - cron: "17 6 * * *" # 03:17 em São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    name: gerar e publicar SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar painéis
        env:
          # METRICS_TOKEN (PAT com read:user) inclui contribuições privadas.
          # Sem ele, cai no GITHUB_TOKEN e mostra só o que é público.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/build.mjs

      - name: Commitar o que mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore(assets): regenera painéis do perfil"
            git push
          fi
